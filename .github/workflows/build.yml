name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug -PverCode=${{ github.run_number }} --no-daemon

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FrameBoost.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FrameBoost.apk \
            --title "FrameBoost latest" \
            --notes "versionCode=${{ github.run_number }}" \
            --latest
